# mpv の標準キー割り当ては mpv.conf で無効にしている（input-builtin-bindings=no）
# ここに書いたキーだけが有効

SPACE        script-message ts-pause
MBTN_RIGHT   script-message ts-pause
LEFT         script-message ts-seek -5
RIGHT        script-message ts-seek 5
Shift+LEFT   script-message ts-seek -10
Shift+RIGHT  script-message ts-seek 10
j            script-message ts-seek -60
J            script-message ts-seek -60
HOME         script-message ts-seek -100000
END          script-message ts-live
,            frame-back-step
.            frame-step
UP           add volume 5
DOWN         add volume -5
WHEEL_UP     add volume 5
WHEEL_DOWN   add volume -5
m            cycle mute
f            cycle fullscreen
ESC          set fullscreen no
MBTN_LEFT    script-binding timeshift/click
MBTN_LEFT_DBL script-binding timeshift/dblclick
TAB          script-message ts-panel

# ペン
p            script-message ts-pen
P            script-message ts-pen
1            script-message ts-pen-color 1
2            script-message ts-pen-color 2
3            script-message ts-pen-color 3
4            script-message ts-pen-color 4
5            script-message ts-pen-color 5
6            script-message ts-pen-color 6
Ctrl+z       script-message ts-pen-undo
BS           script-message ts-pen-undo
c            script-message ts-pen-clear
C            script-message ts-pen-clear

# シミュレーターを開く（TimeshiftViewer 本体が IPC で受け取る）
t            script-message tsv-sim
T            script-message tsv-sim

# スクリーンショット（映像のみ。ペンや操作パネルは写らない）
s            screenshot video
S            screenshot video

# 終了
q            quit
Q            quit
CLOSE_WIN    quit
