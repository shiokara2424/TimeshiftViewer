# ---- Timeshift Viewer 用 mpv 設定 ----
title=Timeshift Viewer
osc=no
osd-bar=no
force-window=immediate
keep-open=no
idle=no
border=yes
window-maximized=yes
# 標準のキー割り当てを使わない（input.conf に書いたキーだけ有効）
input-builtin-bindings=no
# 左ドラッグはペンで使うので、ウィンドウのドラッグ移動はしない
window-dragging=no

# スクリーンショットは TimeshiftViewer フォルダの screenshots に保存
screenshot-dir=screenshots
screenshot-format=png
screenshot-template=shot-%tY%tm%td-%tH%tM%tS-%n

# 巻き戻し用キャッシュ（容量は起動時にコマンドラインで指定）
cache=yes
cache-secs=36000
demuxer-seekable-cache=yes
force-seekable=yes
demuxer-donate-buffer=no
cache-pause=no

# パイプ入力・低遅延
demuxer-lavf-format=mpegts
demuxer-lavf-o-add=fflags=+nobuffer
demuxer-lavf-analyzeduration=0.5
demuxer-lavf-probesize=2000000
stream-buffer-size=4k
video-latency-hacks=yes
audio-buffer=0.1
hwdec=auto-safe
hr-seek=yes

osd-font-size=34
volume-max=100
